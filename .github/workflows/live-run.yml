name: Live research run

# One-off live session: runs cycles against the real APIs, then reports and
# uploads the database. Triggered by pushes to run/* branches only.
on:
  push:
    branches: ["run/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DSB_DATABASE_PATH: dexsignal.db
      DSB_GOPLUS_TOKEN: ${{ secrets.DSB_GOPLUS_TOKEN }}
      DSB_ETHERSCAN_API_KEY: ${{ secrets.DSB_ETHERSCAN_API_KEY }}
      CYCLES: "9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run cycles
        run: |
          for i in $(seq 1 "$CYCLES"); do
            echo "::group::cycle $i"
            dexsignal once || echo "cycle $i reported discovery failure"
            echo "::endgroup::"
            [ "$i" -lt "$CYCLES" ] && sleep 300
          done
      - name: Report
        if: always()
        run: |
          {
            echo '## Stats'; echo '```'; dexsignal stats; echo '```'
            echo '## Evaluate'; echo '```'; dexsignal evaluate; echo '```'
            echo '## Deployers'; echo '```'; dexsignal deployer list | head -40; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for t in snapshots observations risk_checks deployers; do
            dexsignal export "$t" -o "$t.csv" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dexsignal-live-run
          path: |
            dexsignal.db
            *.csv
